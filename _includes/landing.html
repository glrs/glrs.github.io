<div class="row justify-content-center align-items-center p-4">
  <div class="col-lg-4 col-md-6 text-center mt-4">

    <!-- Fine Circle Responsive Image -->
    <div id="container" class="my-2">
      <div id="dummy"></div>
      <div id="element">
        <div class="circle-image-container">
          <img
            src="{{ site.author.light_image | default: site.author.image | relative_url }}"
            data-light-src="{{ site.author.light_image | default: site.author.image | relative_url }}"
            data-dark-src="{{ site.author.dark_image | default: site.author.image | relative_url }}"
            alt="{{ site.author.name }} avatar"
            class="circle-image"
          >
        </div>
      </div>
    </div>

    <p class="text-muted">{{ site.description }}</p>

  </div>
</div>
